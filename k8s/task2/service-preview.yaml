# PREVIEW service - always points at the NEW (idle) colour so it can be tested
# before any real traffic is switched (http://localhost:30082).
apiVersion: v1
kind: Service
metadata:
  name: patient-api-preview
  namespace: pbl-task2
spec:
  type: NodePort
  selector:
    app: patient-api
    color: COLOR_PLACEHOLDER
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30082
