# One template for both colours. Jenkins fills COLOR_PLACEHOLDER with "blue" or "green",
# so we end up with two Deployments: patient-api-blue and patient-api-green.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-api-COLOR_PLACEHOLDER
  namespace: pbl-task2
  labels:
    app: patient-api
    color: COLOR_PLACEHOLDER
spec:
  replicas: 2
  selector:
    matchLabels:
      app: patient-api
      color: COLOR_PLACEHOLDER
  template:
    metadata:
      labels:
        app: patient-api
        color: COLOR_PLACEHOLDER
    spec:
      containers:
        - name: patient-api
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "VERSION_PLACEHOLDER"
            - name: APP_COLOR
              value: "COLOR_PLACEHOLDER"
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
