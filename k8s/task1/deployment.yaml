# IMAGE_PLACEHOLDER / VERSION_PLACEHOLDER are filled in by Jenkins (build number)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-api
  namespace: pbl-task1
  labels:
    app: patient-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: patient-api
  template:
    metadata:
      labels:
        app: patient-api
    spec:
      containers:
        - name: patient-api
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent   # use the image Jenkins just built locally
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "VERSION_PLACEHOLDER"
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
