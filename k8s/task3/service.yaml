apiVersion: v1
kind: Service
metadata:
  name: patient-api
  namespace: pbl-task3
spec:
  type: NodePort
  sessionAffinity: ClientIP   # browser sticks to one pod (patient data is in-memory per pod)
  selector:
    app: patient-api
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30083     # open http://localhost:30083
